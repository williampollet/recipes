<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitchen Planner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen Planner">
<meta name="theme-color" content="#2f8f55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly kitchen notebook, short French labels, thumb-first.
   IDEA: a fridge door planner: a bright saffron band like a magnet board, cards pinned below.
   PICTURE: the working lists themselves (aliments by colour, plats, repas, the week).
   COLOUR and TYPE: saffron band, warm white ground, tomato accent; five food colours; Rubik.
   LAYOUT: one column up to 760px, bottom tab bar, sheets that slide up for every form. */
:root{color-scheme:light;--bg:#f4f8f2;--ink:#17261c;--mute:#5f6f63;--card:#ffffff;--line:#dbe6d9;--band:#2f8f55;--bandink:#ffffff;--acc:#1f7a44;--danger:#c8372d;--legume:#3d9a4a;--feculent:#c08a1c;--fruit:#ec7420;--laitage:#3f7fc4;--proteine:#c43c3c;--legumineuse:#8a5a2b;--epice:#2b8a8a;--star:#f0a800}
:root[data-theme]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{background:var(--band);color:var(--bandink);padding:calc(20px + env(safe-area-inset-top)) max(5vw,16px) 18px}
header>div{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:clamp(32px,9vw,46px);line-height:1.05;font-weight:700;text-wrap:balance}
header p{margin:6px 0 0;font-size:15px}
.menu{float:right;width:46px;height:46px;margin:-4px -6px 0 8px;border-radius:50%;border:0;background:color-mix(in srgb,var(--bandink) 12%,transparent);color:var(--bandink);font-size:24px;line-height:1}
.brand{margin:0 0 2px;font-size:14px;font-weight:500;opacity:.85}
.status{font-size:13px;opacity:.85}
main{padding:16px max(5vw,16px);max-width:792px;margin:0 auto}
input,textarea,select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:46px}
textarea{resize:vertical}
label{display:block;font-weight:500;margin:14px 0 0}label input,label textarea{margin-top:6px;font-weight:400}
fieldset{border:0;padding:0;margin:16px 0 0}legend{font-weight:500;padding:0;margin-bottom:8px}
h2{font-size:24px;line-height:1.15;margin:0 0 4px}h3{font-size:17px;margin:20px 0 8px}
.muted{color:var(--mute);font-weight:400}
.tools{display:grid;gap:10px;margin-bottom:6px}
.filters,.togs,.seg{display:flex;flex-wrap:wrap;gap:8px}
.fchip,.tog{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15px}
.fchip[aria-pressed=true],.tog[aria-pressed=true]{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 18%,var(--card));font-weight:500}
.emo{font-size:20px;line-height:1;flex:none;width:26px;text-align:center}.chip .emo,.tog .emo{font-size:15px;width:auto}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--mute));flex:none}
.t-legume{--c:var(--legume)}.t-feculent{--c:var(--feculent)}.t-fruit{--c:var(--fruit)}.t-laitage{--c:var(--laitage)}.t-proteine{--c:var(--proteine)}.t-legumineuse{--c:var(--legumineuse)}.t-epice{--c:var(--epice)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px}
.row[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.rmain{flex:1;display:flex;flex-direction:column;gap:4px}
.rmain strong{font-weight:500}
.desc{color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--mute)) 15%,transparent);font-size:13px;white-space:nowrap}
.cat{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.pl{font-size:12px;font-weight:500;border:1.5px solid var(--mute);color:var(--mute);border-radius:6px;padding:0 5px;flex:none}
.starbtn{flex:none;width:44px;height:44px;margin:-8px -8px -8px 0;display:grid;place-items:center;border:0;background:transparent;color:var(--mute);font-size:24px;line-height:1}
.starbtn[aria-pressed=true]{color:var(--star)}
.rowwrap{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding-right:12px}
.rowwrap .row{border:0;background:transparent}
.group h2{font-size:18px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.card{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card strong{font-size:18px;font-weight:500}
.slots{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;margin-top:8px;font-size:15px}
.slots .k{color:var(--mute)}
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav>div{flex:1;text-align:center;display:flex;flex-direction:column}
.weeknav>button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:22px}
.link{border:0;background:none;color:var(--acc);text-decoration:underline;padding:4px;font-size:14px}
.who{font-size:12px;font-weight:500;color:#fff;background:#7b5cc4;border-radius:6px;padding:1px 7px;vertical-align:2px;margin-left:6px;white-space:nowrap}
.cklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}.cklist li{display:flex;gap:8px}
.ck{flex:1;display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:400;margin:0;cursor:pointer}.ck input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--acc);flex:none}.ck span:first-of-type{flex:1}.ck.done span:first-of-type{text-decoration:line-through;color:var(--mute)}
.qty{display:inline-flex;gap:6px}.qty input{width:90px}.qty select{width:auto}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.amt{font-weight:500;white-space:nowrap}
.resterow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.chipx{border:0;background:transparent;font-size:18px;line-height:1;padding:0 2px;min-height:28px}
.reste{font-size:12px;font-weight:500;color:#fff;background:#c08a1c;border-radius:6px;padding:1px 7px;vertical-align:2px;margin-right:4px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.weektools{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 12px}.weektools button{flex:1 1 160px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 4px;margin-bottom:10px}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.day h3{margin:0 0 4px;font-size:17px}.day h3::first-letter{text-transform:uppercase}
.meal{display:flex;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:11px 2px;min-height:52px;align-items:flex-start}
.mlist{flex:1;display:flex;flex-direction:column;gap:8px}
.mlabel{width:42px;flex:none;font-weight:500;color:var(--mute)}
.mbody{display:flex;flex-direction:column;font-size:15px}.mbody strong{font-weight:500;font-size:16px}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:20px;text-align:center}
.empty p{margin:0 0 14px}
.primary{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 20px;min-height:46px;font-weight:500}
.ghost{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 16px;min-height:46px}
.danger{background:transparent;color:var(--danger);border:1.5px solid currentColor;border-radius:12px;padding:0 14px;min-height:46px}
.err{color:var(--danger);margin:8px 0 0;min-height:1em;font-size:15px}
.fab{position:fixed;right:max(5vw,16px);bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;background:var(--acc);color:#fff;border:0;border-radius:999px;min-height:56px;padding:0 22px;font-weight:500;font-size:17px;box-shadow:0 6px 18px rgb(0 0 0/.22)}
.fab[hidden]{display:none}
nav.tabs{position:fixed;inset:auto 0 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--mute);text-decoration:none;font-size:13px;min-height:58px}
nav.tabs a[aria-current=page]{color:var(--ink);font-weight:500}nav.tabs a[aria-current=page] svg{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.layer[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgb(0 0 0/.45)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px max(4vw,16px) 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:700px){.layer{align-items:center}.sheet{border-radius:20px}}
.actions{position:sticky;bottom:0;background:var(--bg);display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 calc(16px + env(safe-area-inset-bottom));margin-top:18px;border-top:1px solid var(--line)}
.actions .primary{margin-left:auto}
.slotrow{display:flex;gap:8px;margin-bottom:8px}
.slotbtn{flex:1;display:flex;gap:12px;align-items:center;text-align:left;min-height:52px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.slotbtn .sl{width:72px;flex:none;color:var(--mute);font-weight:500}
.x{width:52px;flex:none;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:22px}
.create{margin-top:12px;padding:12px;border-radius:12px;background:var(--card);border:1.5px dashed var(--line)}.create p{margin:0 0 8px}
.ideas{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.idea{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px dashed var(--acc);background:transparent;color:var(--ink);font-size:15px}
.idea[disabled]{border-style:solid;border-color:var(--line);color:var(--mute);cursor:default}
.addtype{display:flex;gap:8px;margin-top:10px}.addtype input{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 6px 18px rgb(0 0 0/.25)}
#toast[hidden]{display:none}#toast button{background:transparent;border:0;color:#9be3b4;font-weight:700;min-height:40px;padding:0 10px}
.ideabox{margin:14px 0 4px;padding:14px;border-radius:14px;background:#eaf5ec;border:1px solid var(--line)}
.ideabox h3{margin:0 0 4px}
</style>
</head>
<body>
<header><div><button id="menu" class="menu" type="button" aria-label="Données et compte">⋯</button><p class="brand">Kitchen Planner</p><h1 id="title">Planning</h1><p id="sub"></p><p id="status" class="status"></p></div></header>
<main id="main"></main>
<button class="fab" id="fab" data-add type="button">+ Ajouter</button>
<nav class="tabs" aria-label="Pages">
  <a href="#planning" data-r="planning"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Planning</a>
  <a href="#repas" data-r="repas"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6.5"/><circle cx="12" cy="13" r="3"/><path d="M3 4v6M3 7h0M21 4c-1.5 1-2 3-2 5h2v11"/></svg>Repas</a>
  <a href="#plats" data-r="plats"><svg viewBox="0 0 24 24"><path d="M3 12h18a9 9 0 0 1-18 0Z"/><path d="M9 8c0-2 2-2 2-4M14 8c0-2 2-2 2-4"/></svg>Plats</a>
  <a href="#aliments" data-r="aliments"><svg viewBox="0 0 24 24"><path d="M14 7 4 20l13-10Z"/><path d="M14 7c1-2 3-3 5-3-1 2-1 4-2 6M14 7c0-2 1-4 2-5"/></svg>Aliments</a>
</nav>
<div id="layer1" class="layer" hidden><div class="backdrop" data-close></div><div class="sheet" id="sheet1" role="dialog" aria-modal="true"></div></div>
<div id="layer2" class="layer" hidden><div class="backdrop" data-close></div><div class="sheet" id="sheet2" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>
<script>
{
const TYPES=[['legume','Légume'],['feculent','Féculent'],['fruit','Fruit'],['laitage','Laitage'],['proteine','Protéine'],['legumineuse','Légumineuse'],['epice','Épices & condiments']];
const pl=l=>/s$/.test(l)?l:l+'s';
const TL=Object.fromEntries(TYPES);
const SLOTS=[['entree','Entrée'],['plat','Plat'],['proteine','Protéine'],['laitage','Laitage'],['dessert','Dessert']];
const SL=Object.fromEntries(SLOTS);
const HINT={entree:['legume','fruit'],plat:['feculent','legume','proteine','legumineuse'],proteine:['proteine','legumineuse'],laitage:['laitage'],dessert:['fruit','laitage']};
const MOM=[['midi','Midi'],['soir','Soir'],['both','Midi et soir']];const ML=Object.fromEntries(MOM);
const ORIG=[['maison','Maison'],['toutfait','Tout fait']];const OL=Object.fromEntries(ORIG);
const WHO=[['commun','Commun'],['enfant','Enfant']];const WL=Object.fromEntries(WHO);
const M=id=>S.members.find(m=>m.id===id);
const forTxt=list=>{const ms=(list||[]).map(M).filter(Boolean);return ms.length&&(ms.length<S.members.length||S.members.length===1)?ms.map(m=>m.name).join(', '):''};
const tagHtml=t=>t?` <span class="who">${esc(t)}</span>`:'';
const whoTag=r=>tagHtml(forTxt(r.members)||(!(r.members||[]).length&&r.who==='enfant'?'Enfant':''));
const portions=list=>{const ms=(list||[]).map(M).filter(Boolean);const all=ms.length?ms:S.members;return all.length?all.reduce((n,m)=>n+(m.kind==='enfant'?.5:1),0):1};
const fmtQ=(n,u)=>{if(u==='g'&&n>=1000)return (Math.round(n/100)/10).toLocaleString('fr-FR')+' kg';if(u==='ml'&&n>=1000)return (Math.round(n/100)/10).toLocaleString('fr-FR')+' l';const v=u==='g'||u==='ml'?Math.round(n):u==='pièce'?Math.ceil(n-1e-9):Math.ceil(n*2)/2;return v.toLocaleString('fr-FR')+' '+(u==='pièce'&&v>1?'pièces':u==='tranche'&&v>1?'tranches':u)};
const qtyInput=(key,q)=>`<span class="qty"><input type="number" inputmode="decimal" min="0" step="any" data-qn="${esc(key)}" value="${q?q.n:''}" placeholder="—" aria-label="Quantité"><select data-qu="${esc(key)}" aria-label="Unité">${UNITS.map(u=>`<option${q&&q.u===u?' selected':''}>${u}</option>`).join('')}</select></span>`;
const readQty=(root,key)=>{const n=root.querySelector(`[data-qn="${key}"]`),u=root.querySelector(`[data-qu="${key}"]`);return n&&u?qOk({n:parseFloat(String(n.value).replace(',','.')),u:u.value}):undefined};
const allShops=()=>{const set=new Set([...SHOPS,...S.shops]);for(const x of [...S.aliments,...S.plats])if(x.shop)set.add(x.shop);return [...set]};
function shopPicker(root,box,get,set){const draw=()=>{const cur=get();box.innerHTML=`<div class="togs">${['',...allShops()].map(n=>`<button type="button" class="tog" data-shop="${esc(n)}" aria-pressed="${cur===n}">${n?esc(n):'Aucun'}</button>`).join('')}</div><div class="addtype"><input class="shopnew" placeholder="Autre magasin" autocomplete="off" aria-label="Nouveau magasin"><button type="button" class="ghost shopadd">Ajouter</button></div>`;
    const add=()=>{const i=box.querySelector('.shopnew'),v=i.value.trim();if(!v)return;const ex=allShops().find(x=>norm(x)===norm(v));if(!ex){S.shops.push(v);persist()}set(ex||v);draw()};
    box.querySelector('.shopadd').onclick=add;box.querySelector('.shopnew').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}}};
  box.addEventListener('click',e=>{const b=e.target.closest('[data-shop]');if(b){e.stopPropagation();set(b.dataset.shop);draw()}});draw()}
const forMember=(x,id)=>!(x.members||[]).filter(M).length||x.members.includes(id);
const memToggles=set=>S.members.length?`<div class="seg">${S.members.map(m=>`<button type="button" class="tog" data-mem="${esc(m.id)}" aria-pressed="${set.has(m.id)}">${esc(m.name)} <span class="muted">${m.kind==='enfant'?'enfant':'adulte'}</span></button>`).join('')}</div><p class="muted" style="margin:6px 0 0;font-size:14px">Personne de coché = toute la famille.</p>`:'<p class="muted" style="margin:0">Déclare ta famille avec le menu ⋯ en haut à droite pour choisir qui mange quoi.</p>';
const MOMENTS=[['midi','Midi'],['soir','Soir']];
// Plat types: p = "Gratin de courgette", s = "Courgette vapeur"
const CATS=[{id:'soupe',label:'Soupe',p:'Soupe'},{id:'gratin',label:'Gratin',p:'Gratin'},{id:'vapeur',label:'Vapeur',s:'vapeur'},{id:'poele',label:'Poêlé',s:'à la poêle'},{id:'four',label:'Au four',s:'au four'},{id:'salade',label:'Salade',p:'Salade'},{id:'puree',label:'Purée',p:'Purée'},{id:'mijote',label:'Mijoté',p:'Mijoté'},{id:'plancha',label:'Plancha',s:'à la plancha'}];
const LS='platsrepas.v1';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const byName=arr=>[...arr].sort((a,b)=>String(a.name).localeCompare(String(b.name),'fr'));
const UNITS=['g','ml','pièce','tranche','c. à s.'];
const qOk=q=>q&&typeof q==='object'&&Number(q.n)>0&&UNITS.includes(q.u)?{n:Number(q.n),u:q.u}:undefined;
const SHOPS=['Supermarché','Picard','Bio c’ Bon','Marché','Fromagerie','Boulangerie','Boucherie'];
const empty=()=>({shops:[],v:1,aliments:[],plats:[],repas:[],planning:{},cats:[],weeks:[],members:[],courses:{},restes:[]});
function clean(d){const s=empty();if(d&&typeof d==='object'){for(const k of['aliments','plats','repas','cats','weeks','members','restes'])if(Array.isArray(d[k]))s[k]=d[k].filter(x=>x&&typeof x.id==='string');if(d.planning&&typeof d.planning==='object'&&!Array.isArray(d.planning))s.planning=d.planning}
  s.aliments=s.aliments.map(a=>({id:a.id,name:String(a.name||''),type:TL[a.type]?a.type:'legume',qty:qOk(a.qty),shop:typeof a.shop==='string'?a.shop.slice(0,60):'',emoji:typeof a.emoji==='string'?a.emoji.trim().slice(0,12):''}));

    for(const a of S.aliments){const n=norm(a.name);const p=P[n]||P[n.replace(/s$/,'')];if(p)a.qty={n:p[0],u:p[1]};else if((a.type==='fruit'||/compote/.test(n))&&!a.qty)a.qty={n:1,u:'pièce'}}
    S.mig=24}
  return true}

const normEntry=e=>{if(typeof e==='string')e={r:e};if(!e||typeof e!=='object')return null;const r=typeof e.r==='string'&&R(e.r)?e.r:null;
  const slots=e.slots&&typeof e.slots==='object'?cleanSlots(e.slots):r?cleanSlots(R(r).slots):null;if(!slots||!Object.keys(slots).length)return null;
  return {id:typeof e.id==='string'?e.id:String(e.r),r,slots,members:Array.isArray(e.members)?e.members.filter(i=>typeof i==='string'):null}};
const entriesAt=v=>(Array.isArray(v)?v:typeof v==='string'?[v]:[]).map(normEntry).filter(Boolean);

const withProt=e=>mainSlot(e)!=='proteine'&&!!refName(e.slots.proteine);
const entryName=e=>!mainSlot(e)?(t=>t.charAt(0).toUpperCase()+t.slice(1))(entryRest(e))||'Repas':(refName(e.slots[mainSlot(e)])||'Repas')+(withProt(e)?' + '+lc(refName(e.slots.proteine)):'');
const entryRest=e=>{const ms=mainSlot(e);return SLOTS.map(([s])=>s!==ms&&!(s==='proteine'&&withProt(e))?refName(e.slots[s]):'').filter(Boolean).map(lc).join(' · ')};
const idsAt=v=>entriesAt(v).map(e=>e.id);
const slotEntries=(k,m)=>entriesAt(S.planning[k]?.[m]);
const slotList=(k,m)=>idsAt(S.planning[k]?.[m]);
const newEntry=rid=>{const r=R(rid);return {id:uid(),r:rid,slots:cleanSlots(r.slots),members:[...(r.members||[])].filter(M)}};

const slotRows=(slots,key)=>SLOTS.map(([s,l])=>{const o=refObj(slots[s]);return `<div class="slotrow"><button type="button" class="slotbtn" data-eslot="${esc(key)}|${s}"><span class="sl">${l}</span>${o?(slots[s].k==='a'?emoHtml(o):'<span class="pl">Plat</span>')+`<span>${esc(o.name)}</span>`:'<span class="muted">Choisir…</span>'}</button>${o?`<button type="button" class="x" data-eclear="${esc(key)}|${s}" aria-label="Retirer ${l}">×</button>`:''}</div>`}).join('');
function planPick(k,m){const label=`${m==='midi'?'Midi':'Soir'}, ${fromKey(k).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}`;let draft=null;

      root.querySelector('#prs').innerHTML=(out?`<h3 style="margin-top:14px">Dans ce créneau</h3>${out}`:'')+(inn?`<h3>Restes mangés ici</h3><div class="resterow">${inn}</div>`:'');

      if(!pq)return;const q=norm(pq.value),cur=ents.map(e=>e.r);const arr=byName(S.repas).filter(r=>!q||norm(r.name+' '+summary(r)).includes(q)).sort((a,b)=>cur.includes(b.id)-cur.includes(a.id));

      const ed=e.target.closest('[data-edel]');if(ed){const id=ed.dataset.edel;closeSheet(1);withUndo('Repas retiré du créneau',()=>{assign(k,m,slotEntries(k,m).filter(x=>x.id!==id));S.restes=S.restes.filter(x=>!(x.rid===id&&x.from.k===k&&x.from.m===m))});planPick(k,m);return}

/* ---------- modèles de semaine ---------- */
let clip=null;
function weekDays(off){const now=new Date();now.setHours(0,0,0,0);const ws=new Date(now);ws.setDate(now.getDate()-((now.getDay()+6)%7)+off*7);return [...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d})}

const countWeek=days=>days.reduce((n,d)=>n+MOMENTS.reduce((c,[m])=>c+(d?entriesAt(d[m]).length:0),0),0);
function writeWeek(off,days,msg){withUndo(msg,()=>weekDays(off).forEach((d,i)=>{const k=keyOf(d);for(const [m] of MOMENTS)assign(k,m,days[i]?entriesAt(days[i][m]):[])}))}
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function weekSheet(){const cur=readWeek(ui.week),n=countWeek(cur);

    const build=()=>{const al=new Map(),ready=new Map();

    const amount=(e,ready)=>ready?(e.p===1?'1 portion':e.p.toLocaleString('fr-FR')+' portions'):e.u.size?[...e.u].map(([u,n])=>fmtQ(n,u)).join(' + '):(e.c>1?'×'+e.c:'');

  if('close' in ds){closeTop();return}
  if(t.id==='menu'){menuSheet();return}
  if('add' in ds){({aliments:()=>alimentForm(),plats:()=>platForm(),repas:()=>repasForm()})[route]?.();return}
  if(ds.openAl){alimentForm(ds.openAl);return}
  if(ds.openPlat){platForm(ds.openPlat);return}
  if(ds.openRepas){repasForm(ds.openRepas);return}
  if(ds.star){const p=P(ds.star);if(p){p.fav=!p.fav;persist();render();toast(p.fav?'Ajouté aux favoris':'Retiré des favoris')}return}
  if(ds.idea&&t.closest('#main')&&!t.disabled){platForm(null,{al:ui.al,cat:ds.idea});return}
  if(ds.tf!==undefined){ui.tf=ds.tf;render();return}
  if(ds.catf!==undefined){ui.cat=ui.cat===ds.catf?'':ds.catf;render();return}
  if(ds.memf!==undefined){ui.mem=ui.mem===ds.memf?'':ds.memf;render();return}
  if(ds.whof!==undefined){ui.who=ui.who===ds.whof?'':ds.whof;render();return}
  if(ds.momf!==undefined){ui.mom=ui.mom===ds.momf?'':ds.momf;render();return}
  if(ds.orif!==undefined){ui.ori=ui.ori===ds.orif?'':ds.orif;render();return}
  if('favf' in ds){ui.fav=!ui.fav;render();return}
  if(ds.week){ui.week=ds.week==='0'?0:ui.week+Number(ds.week);drawList();return}
  if(ds.day){planPick(ds.day,ds.moment);return}
  if('wsheet' in ds){weekSheet();return}
  if('courses' in ds){coursesSheet();return}
  if('wpaste' in ds&&clip){writeWeek(ui.week,clip,'Semaine collée');return}
  if('starter' in ds){starter();return}});
if(migrate())persist();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
